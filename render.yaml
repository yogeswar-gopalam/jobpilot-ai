services:
  - type: web
    name: jobpilot-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 90
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AI_BASE_URL
        value: http://localhost:11434/v1
      - key: AI_MODEL
        value: llama3.2:3b
